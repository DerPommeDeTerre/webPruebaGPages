<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Escríbele a Leobardo Maya para colaborar en un proyecto.">
    <title>Contacto | Nimbus Panem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <a class="logo" href="index.html">Nimbus Panem</a>
            <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Abrir menú">
            <label for="menu-toggle" class="menu-icon"><span></span><span></span><span></span></label>
            <nav class="nav-menu">
                <a href="index.html">Home</a>
                <a href="sobre-mi.html">Sobre mí</a>
                <a href="contacto.html" class="activo">Contacto</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="seccion">
            <div class="container contacto-container">
                <div class="contacto-header">
                    <span class="etiqueta">Contacto</span>
                    <h1>Hablemos</h1>
                    <p>¿Tienes un proyecto o una pregunta? Envíame un mensaje.</p>
                </div>

                <!-- Reemplaza TU_CORREO por tu correo (servicio gratuito formsubmit.co) -->
                <form class="contacto-form" action="https://formsubmit.co/TU_CORREO" method="POST">
                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" autocomplete="name" required>
                    </div>
                    <div class="campo">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email" required>
                    </div>
                    <div class="campo">
                        <label for="asunto">Asunto</label>
                        <input type="text" id="asunto" name="_subject" placeholder="¿En qué puedo ayudarte?" required>
                    </div>
                    <div class="campo">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="7" placeholder="Escribe tu mensaje..." required></textarea>
                    </div>
                    <button type="submit">Enviar mensaje</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container"><p>Nimbus Panem 2026</p></div>
    </footer>
</body>
</html>
